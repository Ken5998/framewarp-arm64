name: CI

# Builds the layer on an aarch64 runner in Fedora 44, the base of ArmadaOS,
# tests the motion shaders and the win-fg flow, runs vkcube through the layer
# in every mode and while switching modes, on Mesa's software Vulkan driver
# with the validation layer below it, and keeps the package as an artifact.

on:
  push:
  workflow_dispatch:

jobs:
  layer:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          dnf -y install gcc-c++ libstdc++-static cmake make vulkan-headers vulkan-loader-devel glslang tar gzip \
            mesa-vulkan-drivers vulkan-tools vulkan-validation-layers xorg-x11-server-Xvfb
      - uses: actions/checkout@v5
      - name: Check the scripts
        run: bash -n scripts/*.sh scripts/framewarp-mode
      - name: Build
        run: scripts/build.sh out
      - name: Test the motion shaders
        run: build/motion_test
      - name: Test the win-fg flow and generated frames
        run: build/flow_test
      - name: Run vkcube through the layer
        run: |
          tar -xzf out/framewarp-*.tar.gz -C /tmp
          /tmp/framewarp/install.sh
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          # The layer is implicit; a second copy enabled explicitly sits above
          # the validation layer, so validation checks the layer's own calls.
          mkdir -p /tmp/explicit
          sed 's/VK_LAYER_FRAMEWARP_frame_generation/VK_LAYER_FRAMEWARP_ci/' \
            ~/.local/share/vulkan/implicit_layer.d/VkLayer_framewarp.json > /tmp/explicit/framewarp.json
          export DISPLAY=:99 VK_LAYER_PATH=/tmp/explicit:/usr/share/vulkan/explicit_layer.d
          export VK_INSTANCE_LAYERS=VK_LAYER_FRAMEWARP_ci:VK_LAYER_KHRONOS_validation
          export VK_KHRONOS_VALIDATION_VALIDATE_SYNC=true
          for mode in warp debug copy camera camera-debug flow interp off; do
            for mult in 2 3 4; do
              run=$mode-$mult
              # Without generated frames vkcube runs much faster.
              count=300; [ $mode = off ] && count=3000
              FRAMEWARP_MODE=$mode FRAMEWARP_MULT=$mult FRAMEWARP_LOG=/tmp/fw-$run.log FRAMEWARP_LOG_EVERY=1 \
                timeout 40 vkcube --c $count > /tmp/vkcube-$run.txt 2>&1
              cat /tmp/vkcube-$run.txt
              if grep -q -i -E "validation (error|warning)|VUID" /tmp/vkcube-$run.txt; then exit 1; fi
              grep -q "^real" /tmp/fw-$run.log
            done
          done
      - name: Switch modes while vkcube runs
        run: |
          Xvfb :98 -screen 0 1280x720x24 &
          sleep 2
          export DISPLAY=:98 VK_LAYER_PATH=/tmp/explicit:/usr/share/vulkan/explicit_layer.d
          export VK_INSTANCE_LAYERS=VK_LAYER_FRAMEWARP_ci:VK_LAYER_KHRONOS_validation
          export VK_KHRONOS_VALIDATION_VALIDATE_SYNC=true FRAMEWARP_CONTROL=/tmp/fw-control
          (for m in "interp" "flow 2" "camera" "off" "warp 4" "interp auto"; do
             sleep 4; scripts/framewarp-mode $m; done) &
          FRAMEWARP_MODE=warp FRAMEWARP_MULT=4 FRAMEWARP_LOG=/tmp/fw-switch.log FRAMEWARP_LOG_EVERY=1 \
            timeout 60 vkcube --c 2000 > /tmp/vkcube-switch.txt 2>&1 || [ $? = 124 ]
          wait
          cat /tmp/vkcube-switch.txt
          if grep -q -i -E "validation (error|warning)|VUID" /tmp/vkcube-switch.txt; then exit 1; fi
          test "$(grep -c "^control file" /tmp/fw-switch.log)" -ge 4
      - uses: actions/upload-artifact@v4
        with:
          name: framewarp
          path: out/*.tar.gz
