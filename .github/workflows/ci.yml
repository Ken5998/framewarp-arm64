name: CI

# Builds the layer on an aarch64 runner in Fedora 44, the base of ArmadaOS,
# tests the motion shaders and runs vkcube through the layer on Mesa's
# software Vulkan driver with the validation layer below it, and keeps the
# package as an artifact.

on:
  push:
  workflow_dispatch:

jobs:
  layer:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          dnf -y install gcc-c++ libstdc++-static cmake make vulkan-headers vulkan-loader-devel glslang tar gzip \
            mesa-vulkan-drivers vulkan-tools vulkan-validation-layers xorg-x11-server-Xvfb
      - uses: actions/checkout@v5
      - name: Check the scripts
        run: bash -n scripts/*.sh
      - name: Build
        run: scripts/build.sh out
      - name: Test the motion shaders
        run: build/motion_test
      - name: Run vkcube through the layer
        run: |
          tar -xzf out/framewarp-*.tar.gz -C /tmp
          /tmp/framewarp/install.sh
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          # The layer is implicit; a second copy enabled explicitly sits above
          # the validation layer, so validation checks the layer's own calls.
          mkdir -p /tmp/explicit
          sed 's/VK_LAYER_FRAMEWARP_frame_generation/VK_LAYER_FRAMEWARP_ci/' \
            ~/.local/share/vulkan/implicit_layer.d/VkLayer_framewarp.json > /tmp/explicit/framewarp.json
          export DISPLAY=:99 VK_LAYER_PATH=/tmp/explicit:/usr/share/vulkan/explicit_layer.d
          export VK_INSTANCE_LAYERS=VK_LAYER_FRAMEWARP_ci:VK_LAYER_KHRONOS_validation
          export VK_KHRONOS_VALIDATION_VALIDATE_SYNC=true
          for mode in warp debug copy camera camera-debug; do
            for mult in 2 3 4; do
              run=$mode-$mult
              FRAMEWARP_MODE=$mode FRAMEWARP_MULT=$mult FRAMEWARP_LOG=/tmp/fw-$run.log FRAMEWARP_LOG_EVERY=1 \
                timeout 20 vkcube --c 300 > /tmp/vkcube-$run.txt 2>&1
              cat /tmp/vkcube-$run.txt
              if grep -q -i -E "validation (error|warning)|VUID" /tmp/vkcube-$run.txt; then exit 1; fi
              grep -q "^real" /tmp/fw-$run.log
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: framewarp
          path: out/*.tar.gz
