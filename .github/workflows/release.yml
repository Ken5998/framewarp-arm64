name: Release

# Builds the layer and publishes it as release vVERSION (the VERSION file).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  layer:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: dnf -y install gcc-c++ cmake make vulkan-headers vulkan-loader-devel glslang tar gzip
      - uses: actions/checkout@v5
      - name: Build
        run: scripts/build.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: framewarp
          path: out/*.tar.gz

  publish:
    needs: layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: framewarp
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          archive="out/framewarp-$version-aarch64.tar.gz"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Install

          On ArmadaOS, in Desktop Mode, extract the package and run framewarp/install.sh. Then start the game from Steam with FRAMEWARP=1 FRAMEWARP_MULT=3 in front of its launch options; the measurements go to ~/framewarp.log. See the README for the settings.

          SHA-256: \`$sha256\`
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$archive" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "$archive" --title "framewarp $version" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
